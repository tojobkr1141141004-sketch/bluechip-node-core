<!doctype html>
<html lang="ko"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>에코 프리미엄 자산 허브 · BLUECHIP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{--bg:#0b1220;--p:#121a2b;--p2:#18233a;--t:#f4f7fb;--m:#9aa8bc;--l:rgba(255,255,255,.1);--ok:#22c55e;--g:#eab308;font-family:Pretendard,system-ui,sans-serif;color:var(--t);background:radial-gradient(circle at top,#152038,var(--bg) 55%)}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px}
.hdr{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--l);background:rgba(11,18,32,.9)}
.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#16301f;border:1px solid rgba(34,197,94,.35)}
h1{margin:0;font-size:1.1rem}.sub{margin:2px 0 0;color:var(--m);font-size:.82rem}
.nav button{background:0;color:var(--m);border-radius:999px}.nav button.on{background:var(--p2);color:var(--t)}
.pill{padding:6px 10px;border-radius:999px;background:var(--p2);color:var(--m);font-size:.78rem;font-weight:600}
.pill.ok{background:rgba(34,197,94,.15);color:#86efac}.pill.warn{background:rgba(245,158,11,.15);color:#fcd34d}
.main{padding:16px}.grid{display:grid;gap:14px}@media(min-width:960px){.grid{grid-template-columns:220px 1fr 260px;min-height:70vh}}
.panel{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px}
.nodes{display:flex;gap:8px;overflow:auto}@media(min-width:960px){.nodes{flex-direction:column}}
.node{min-width:140px;text-align:left;background:0;color:inherit;border:1px solid transparent;border-radius:12px;padding:10px}
.node.on{background:var(--p2);border-color:rgba(34,197,94,.4)}.node b{display:flex;justify-content:space-between}
.meta{color:var(--m);font-size:.8rem;margin-top:4px}
.globe{min-height:300px;position:relative;background:radial-gradient(circle at 50% 45%,#1b2a44,#0d1524 70%);padding:0;overflow:hidden}
.globe canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.cap{position:absolute;left:12px;bottom:10px;color:var(--m);font-size:.75rem}
.metric{background:var(--p2);border-radius:12px;padding:10px;margin-bottom:8px}.metric span{color:var(--m);font-size:.75rem;display:block}
.btn-p{background:linear-gradient(135deg,#16a34a,#22c55e);color:#052e16;font-weight:700}.btn-s{background:var(--p2);color:var(--t);border:1px solid var(--l)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.esc{display:grid;gap:10px}.esc .step{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--p2)}
.esc .step.done{outline:1px solid rgba(34,197,94,.35)}.esc .step.cur{outline:1px solid rgba(234,179,8,.5)}
.tick{height:90px;background:var(--p2);border-radius:12px;margin-top:8px}
.guide p{line-height:1.55;color:var(--m)}
</style></head><body>
<header class="hdr">
  <div class="brand"><div class="mark">🌿</div><div><h1>에코 프리미엄 자산 허브</h1><p class="sub">BLUECHIP · 누구나 쓰기 쉬운 노드 센터</p></div></div>
  <nav class="nav" id="nav">
    <button data-v="globe" class="on">🌍 지구본 노드</button>
    <button data-v="health">📊 자산 건강</button>
    <button data-v="vault">🔒 안심 금고</button>
    <button data-v="guide">🌿 이용 안내</button>
  </nav>
  <div class="pill ok" id="status">● 정상 연결</div>
</header>
<main class="main" id="app"></main>
<script>
const nodes=[
{id:"seoul",name:"서울",lat:37.57,lon:126.98,h:"healthy",ms:12},
{id:"tokyo",name:"도쿄",lat:35.68,lon:139.69,h:"healthy",ms:18},
{id:"singapore",name:"싱가포르",lat:1.35,lon:103.82,h:"healthy",ms:22},
{id:"frankfurt",name:"프랑크푸르트",lat:50.11,lon:8.68,h:"degraded",ms:48},
{id:"virginia",name:"버지니아",lat:38.9,lon:-77.04,h:"healthy",ms:28},
{id:"oregon",name:"오레곤",lat:45.52,lon:-122.68,h:"partitioned",ms:0},
{id:"sydney",name:"시드니",lat:-33.87,lon:151.21,h:"healthy",ms:35},
{id:"mumbai",name:"뭄바이",lat:19.08,lon:72.88,h:"healthy",ms:31}
];
let view="globe",sel="seoul",G={x:.2,y:0,drag:0,lx:0,ly:0,mv:0},ring=Array(48).fill(0),esc={phase:0,id:"demo-"+Date.now().toString(36)};
const phases=["준비","확인","안전 잠금","정산 완료"];
function hLabel(h){return h==="healthy"?"정상":h==="degraded"?"주의":"연결 끊김"}
function hPill(h){return h==="healthy"?"ok":h==="degraded"?"warn":""}
function go(){
  const n=nodes.find(x=>x.id===sel)||nodes[0];
  const app=document.getElementById("app");
  if(view==="globe")app.innerHTML=globeHTML(n);
  else if(view==="health")app.innerHTML=healthHTML(n);
  else if(view==="vault")app.innerHTML=vaultHTML();
  else app.innerHTML=guideHTML();
  if(view==="globe"){
    const cv=document.getElementById("gcv");
    if(cv)drawGlobe(cv);
  }
  if(view==="health"){
    const cv=document.getElementById("tcv");
    if(cv)drawTick(cv);
  }
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  document.getElementById("status").className="pill "+(nodes.some(x=>x.h==="partitioned")?"warn":"ok");
  document.getElementById("status").textContent=nodes.some(x=>x.h==="partitioned")?"● 일부 주의":"● 정상 연결";
}
function globeHTML(n){
  return `<div class="grid">
    <aside class="panel"><div class="nodes">${nodes.map(x=>`<button class="node ${x.id===sel?"on":""}" data-id="${x.id}"><b>${x.name}<span class="pill ${hPill(x.h)}">${hLabel(x.h)}</span></b><div class="meta">응답 ${x.ms?x.ms+"ms":"—"}</div></button>`).join("")}</div></aside>
    <section class="panel globe"><canvas id="gcv"></canvas><div class="cap">드래그해서 지구본을 돌려보세요 · 점 = 노드</div></section>
    <aside class="panel">
      <div class="metric"><span>선택 노드</span><b>${n.name}</b></div>
      <div class="metric"><span>상태</span><b class="pill ${hPill(n.h)}">${hLabel(n.h)}</b></div>
      <div class="metric"><span>응답 속도</span><b>${n.ms?n.ms+" ms":"연결 없음"}</b></div>
      <p class="sub">전 세계 노드를 한눈에 보는 실시간 지도입니다.</p>
    </aside></div>`;
}
function healthHTML(n){
  return `<div class="grid" style="grid-template-columns:1fr">
    <article class="panel">
      <h2 style="margin:0 0 8px">📊 자산 건강</h2>
      <p class="sub">선택한 노드의 응답 속도와 흐름을 간단히 보여줍니다.</p>
      <div class="row">${nodes.map(x=>`<button class="btn-s ${x.id===sel?"btn-p":""}" data-id="${x.id}">${x.name}</button>`).join("")}</div>
      <div class="metric" style="margin-top:12px"><span>현재 노드</span><b>${n.name} · ${hLabel(n.h)} · ${n.ms?n.ms+"ms":"—"}</b></div>
      <canvas class="tick" id="tcv"></canvas>
    </article></div>`;
}
function vaultHTML(){
  return `<article class="panel esc">
    <h2 style="margin:0">🔒 안심 금고</h2>
    <p class="sub">준비 → 확인 → 안전 잠금 → 정산 완료 순서로 보호 흐름을 살펴봅니다. (데모)</p>
    <div class="metric"><span>세션</span><b>${esc.id}</b></div>
    ${phases.map((p,i)=>`<div class="step ${i<esc.phase?"done":""} ${i===esc.phase?"cur":""}"><b>${i+1}</b><span>${p}</span></div>`).join("")}
    <div class="row">
      <button class="btn-p" id="next">다음 단계</button>
      <button class="btn-s" id="reset">처음부터</button>
    </div>
  </article>`;
}
function guideHTML(){
  return `<article class="panel guide"><h2>🌿 이용 안내</h2><p class="sub">복잡한 차트 대신, 누구나 터치 한 번으로 전 세계 노드 상태와 자산 보호 흐름을 살펴봅니다.</p><p>🌍 지구본 돌리기 · 📊 건강 체크 · 🔒 안심 금고(준비→확인→잠금→정산)</p><p class="sub">상태·보호 흐름 데모이며, 수익·배당 자동 확정을 의미하지 않습니다.</p></article>`;
}
function drawGlobe(cv){
 const ctx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2),r=cv.parentElement.getBoundingClientRect();
 cv.width=r.width*dpr;cv.height=r.height*dpr;const w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*.36;
 const proj=(lat,lon)=>{const phi=(90-lat)*Math.PI/180,th=(lon+180)*Math.PI/180;let x=-R*Math.sin(phi)*Math.cos(th),y=R*Math.cos(phi),z=R*Math.sin(phi)*Math.sin(th);
 const cY=Math.cos(G.y),sY=Math.sin(G.y);let x1=x*cY-z*sY,z1=x*sY+z*cY;x=x1;z=z1;const cX=Math.cos(G.x),sX=Math.sin(G.x);let y1=y*cX-z*sX,z2=y*sX+z*cX;return{x:cx+x,y:cy+y1,z:z2,v:z2>-R*.15}};
 if(!G.drag)G.y+=.003;
 const g=ctx.createRadialGradient(cx-R*.2,cy-R*.2,R*.2,cx,cy,R);g.addColorStop(0,"#243552");g.addColorStop(1,"#0f1728");
 ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
 nodes.map(n=>({n,p:proj(n.lat,n.lon)})).filter(x=>x.p.v).sort((a,b)=>a.p.z-b.p.z).forEach(({n,p})=>{ctx.beginPath();ctx.arc(p.x,p.y,(n.id===sel?6:4)*dpr,0,Math.PI*2);ctx.fillStyle=n.h==="partitioned"?"#64748b":n.h==="degraded"?"#f59e0b":n.id===sel?"#fde68a":"#86efac";ctx.fill()});
 cv.onpointerdown=e=>{G.drag=1;G.mv=0;G.lx=e.clientX;G.ly=e.clientY;cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!G.drag)return;const dx=e.clientX-G.lx,dy=e.clientY-G.ly;if(Math.abs(dx)+Math.abs(dy)>3)G.mv=1;G.y+=dx*.008;G.x=Math.max(-.8,Math.min(.8,G.x+dy*.005));G.lx=e.clientX;G.ly=e.clientY};
 cv.onpointerup=()=>{G.drag=0};
}
function drawTick(cv){const ctx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2),r=cv.parentElement.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const w=cv.width,h=cv.height,max=Math.max(...ring,1)*1.15;ctx.clearRect(0,0,w,h);ctx.fillStyle="#9aa8bc";ctx.font=`${11*dpr}px Pretendard,sans-serif`;ctx.fillText("⚡ 실시간 흐름",10*dpr,14*dpr);ctx.beginPath();ring.forEach((v,i)=>{const x=(i/(ring.length-1))*w,y=h-(v/max)*(h*.7)-8*dpr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle="#86efac";ctx.lineWidth=2*dpr;ctx.stroke()}
let last=performance.now(),acc=0;
function tick(dt){ring.shift();ring.push(20+Math.random()*40+(nodes.find(x=>x.id===sel)?.ms||20)*.3);if(view==="globe"){const cv=document.getElementById("gcv");if(cv)drawGlobe(cv)}if(view==="health"){const cv=document.getElementById("tcv");if(cv)drawTick(cv)}}
function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;tick(dt);acc+=dt;if(acc>.25){acc=0;go()}requestAnimationFrame(loop)}
go();requestAnimationFrame(loop);
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button[data-v]");if(b){view=b.dataset.v;go()}};
document.getElementById("app").onclick=e=>{
  const id=e.target.closest("[data-id]")?.dataset?.id;if(id){sel=id;go()}
  if(e.target.id==="next"){esc.phase=Math.min(3,esc.phase+1);go()}
  if(e.target.id==="reset"){esc.phase=0;esc.id="demo-"+Date.now().toString(36);go()}
};
</script></body></html>
