<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07111f"/>
<title>BLUECHIP · Edge Asset Hub</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{
  --bg:#06101d;--panel:rgba(13,24,40,.82);--panel-2:#101e31;--line:rgba(148,163,184,.14);
  --text:#f8fafc;--muted:#8fa1b6;--green:#34d399;--cyan:#22d3ee;--amber:#fbbf24;--danger:#fb7185;
  --shadow:0 24px 70px rgba(0,0,0,.32);font-family:Pretendard,system-ui,sans-serif;color:var(--text);
  background:#06101d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 15% 0%,rgba(34,211,238,.08),transparent 32%),
  radial-gradient(circle at 85% 0%,rgba(52,211,153,.09),transparent 34%),
  var(--bg)}
body{overflow-x:hidden}
button{font:inherit;border:0;cursor:pointer}
.shell{min-height:100vh;padding:20px}
.hdr{
  max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;justify-content:space-between;
  padding:14px 2px 18px;border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(52,211,153,.24),rgba(34,211,238,.15));border:1px solid rgba(52,211,153,.28);
  box-shadow:0 0 40px rgba(52,211,153,.12)}
.mark:after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(52,211,153,.65),transparent 30%);animation:spin 5s linear infinite}
.mark svg{position:relative;z-index:1;width:22px;height:22px}
h1{font-size:16px;margin:0;letter-spacing:-.01em}.sub{font-size:12px;color:var(--muted);margin:3px 0 0}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.nav button{padding:9px 11px;border-radius:10px;color:var(--muted);background:transparent;transition:background .2s,color .2s,transform .2s}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--text);transform:translateY(-1px)}
.nav button.on{background:#11243a;color:#fff}
.status{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.2);color:#9cf2cf;font-size:12px;font-weight:700;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.55);animation:pulse 2s infinite}
.toast-stack{position:fixed;top:18px;right:18px;z-index:60;width:min(380px,calc(100vw - 36px));display:grid;gap:10px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(9,18,32,.92);
  border:1px solid rgba(52,211,153,.26);box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 32px rgba(52,211,153,.08);
  backdrop-filter:blur(16px);transform:translateY(-8px);opacity:0;animation:toastIn .28s ease forwards}
.toast.exit{animation:toastOut .28s ease forwards}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:6px;flex:0 0 auto}
.toast b{display:block;font-size:12px;margin-bottom:2px}.toast span{font-size:11px;line-height:1.45;color:#a9b8c8}
.main{max-width:1320px;margin:18px auto 0}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:14px}
.panel{position:relative;background:linear-gradient(180deg,rgba(17,31,50,.83),rgba(10,20,35,.82));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.panel-pad{padding:18px}
.nodes{display:grid;gap:6px;padding:10px}
.node{padding:11px;border-radius:14px;background:transparent;color:inherit;text-align:left;border:1px solid transparent;transition:.18s}
.node:hover{background:rgba(255,255,255,.035)}.node.on{background:#11243a;border-color:rgba(52,211,153,.28)}
.node-top{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}.dot.ok{background:var(--green);box-shadow:0 0 12px rgba(52,211,153,.7)}.dot.warn{background:var(--amber)}
.meta{margin-top:5px;padding-left:15px;color:var(--muted);font-size:11px}
.tag{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}.tag.ok{background:rgba(52,211,153,.12);color:#97f0ca}.tag.warn{background:rgba(251,191,36,.12);color:#fde68a}.tag.off{background:rgba(148,163,184,.12);color:#b7c3d1}
.hero{min-height:520px}
.hero-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:18px 18px 4px}
.kicker{font-size:11px;color:#8fe6ce;text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.hero-title{font-size:22px;font-weight:800;letter-spacing:-.035em;margin:5px 0 6px}.hero-copy{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
.canvas-wrap{height:310px;position:relative;margin:6px 0 0}.canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none}
.glow{position:absolute;inset:12% 7% 8%;background:radial-gradient(circle,rgba(34,211,238,.07),transparent 55%);pointer-events:none}
.chart-card{margin:0 18px 18px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.spark{height:84px}.spark svg{width:100%;height:100%;display:block}
.spark path.line{fill:none;stroke:var(--green);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4.8s ease-in-out infinite alternate}
.spark path.glow{fill:url(#area);stroke:none;opacity:.7;animation:breathe 4.8s ease-in-out infinite}
.axis{display:flex;justify-content:space-between;margin-top:6px;color:#6f8299;font-size:10px}
.metric-stack{display:grid;gap:10px;padding:18px}
.metric{padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.metric span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.metric b{font-size:18px;letter-spacing:-.03em}
.metric small{display:block;color:#91a5bb;font-size:10px;margin-top:4px}
.big-value{font-size:28px!important}.positive{color:#99f6cf}
.action{width:100%;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#34d399,#22d3ee);color:#05261c;font-weight:800;box-shadow:0 14px 32px rgba(34,211,238,.16)}
.action:hover{filter:brightness(1.03);transform:translateY(-1px)}.action{transition:.18s}
.secondary{width:100%;padding:11px 14px;border-radius:14px;background:#122238;color:#dce7f1;border:1px solid var(--line);margin-top:8px}
.notice{padding:11px 12px;border-radius:14px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.16);color:#cfd7e2;font-size:10px;line-height:1.5;margin-top:10px}
.footer-note{max-width:1320px;margin:13px auto 0;color:#61758e;font-size:10px;padding:0 2px}
.vault-list{display:grid;gap:10px}.step{display:flex;gap:10px;align-items:center;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.step .num{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:#14263c;color:#b8c8d9;font-size:11px;font-weight:800}
.step.done{border-color:rgba(52,211,153,.2)}.step.done .num{background:rgba(52,211,153,.12);color:#9cf2cf}.step.cur{border-color:rgba(251,191,36,.25)}
.guide{padding:20px}.guide p{color:var(--muted);line-height:1.65;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kpi{padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.024);border:1px solid var(--line)}.kpi b{font-size:14px}.kpi span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.nodes{grid-template-columns:repeat(4,minmax(120px,1fr));overflow:auto}.hero{min-height:460px}}
@media(max-width:700px){.shell{padding:12px}.hdr{align-items:flex-start;flex-wrap:wrap}.nav{order:3;width:100%;justify-content:flex-start}.nav button{flex:1 1 auto}.nodes{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas-wrap{height:240px}.kpis{grid-template-columns:1fr 1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}50%{box-shadow:0 0 0 7px rgba(52,211,153,0)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes draw{to{stroke-dashoffset:120}}@keyframes breathe{0%,100%{opacity:.42}50%{opacity:.8}}
@keyframes toastIn{to{opacity:1;transform:translateY(0)}}@keyframes toastOut{to{opacity:0;transform:translateX(18px) scale(.98)}}
</style>
</head>
<body>
<div class="shell">
<header class="hdr">
  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 3 5 13h6l-1 8 9-11h-6l0-7Z" stroke="#051b16" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </div>
    <div><h1>BLUECHIP · Edge Asset Hub</h1><p class="sub">실시간 노드 상태와 보호 흐름을 한 화면에서 확인하는 데모 센터</p></div>
  </div>
  <nav class="nav" id="nav" aria-label="주 메뉴">
    <button data-v="globe" class="on">지구본 노드</button>
    <button data-v="health">자산 건강</button>
    <button data-v="vault">안심 금고</button>
    <button data-v="guide">이용 안내</button>
  </nav>
  <div class="status"><i></i><span id="statusText">정상 연결</span></div>
</header>

<div class="toast-stack" id="toasts" aria-live="polite"></div>
<main class="main" id="app"></main>
<p class="footer-note">데모 데이터는 실제 투자 수익·배당금·금괴 보유·출금을 의미하지 않습니다. 가격·잔액·노드 수치는 예시입니다.</p>
</div>

<script>
const nodes=[
 {id:"seoul",name:"서울",lat:37.57,lon:126.98,h:"healthy",ms:12},
 {id:"tokyo",name:"도쿄",lat:35.68,lon:139.69,h:"healthy",ms:18},
 {id:"singapore",name:"싱가포르",lat:1.35,lon:103.82,h:"healthy",ms:22},
 {id:"frankfurt",name:"프랑크푸르트",lat:50.11,lon:8.68,h:"degraded",ms:48},
 {id:"virginia",name:"버지니아",lat:38.90,lon:-77.04,h:"healthy",ms:28},
 {id:"oregon",name:"오레곤",lat:45.52,lon:-122.68,h:"partitioned",ms:0},
 {id:"sydney",name:"시드니",lat:-33.87,lon:151.21,h:"healthy",ms:35},
 {id:"mumbai",name:"뭄바이",lat:19.08,lon:72.88,h:"healthy",ms:31}
];

const activity=[
 {title:"노드 동기화",text:"서울 엣지 노드에서 샘플 이벤트가 갱신되었습니다."},
 {title:"상태 업데이트",text:"싱가포르 노드 응답 시간 22ms가 반영되었습니다."},
 {title:"보호 흐름",text:"데모 세션의 다음 단계가 준비되었습니다."},
 {title:"시장 데이터",text:"예시 시세 스트림이 정상적으로 렌더링되었습니다."}
];

let view="globe",sel="seoul",G={x:.2,y:.2,drag:false,lx:0,ly:0},ring=Array(52).fill(24),demoValue=1485290,phase=0;
const phases=["준비","확인","안전 잠금","정산 완료"];

const app=document.getElementById("app"),toastRoot=document.getElementById("toasts");
const selected=()=>nodes.find(n=>n.id===sel)||nodes[0];
const label=h=>h==="healthy"?"정상":h==="degraded"?"주의":"연결 끊김";
const cls=h=>h==="healthy"?"ok":h==="degraded"?"warn":"off";

function shellMetric(title,value,sub){
 return '<div class="metric"><span>'+title+'</span><b>'+value+'</b>'+ (sub?'<small>'+sub+'</small>':'')+'</div>';
}

function globeHTML(){
 const n=selected();
 return '<div class="grid">'+
  '<aside class="panel"><div class="nodes">'+nodes.map(x=>
   '<button class="node '+(x.id===sel?"on":"")+'" data-id="'+x.id+'">'+
   '<div class="node-top"><span><i class="dot '+cls(x.h)+'"></i> '+x.name+'</span><span class="tag '+cls(x.h)+'">'+label(x.h)+'</span></div>'+
   '<div class="meta">응답 '+(x.ms?x.ms+"ms":"—")+'</div></button>').join('')+
  '</div></aside>'+
  '<section class="panel hero">'+
   '<div class="hero-head"><div><div class="kicker">Live Edge Telemetry</div><div class="hero-title">전 세계 노드 · 실시간 시각화</div><p class="hero-copy">드래그로 지구본을 회전하고, 노드를 선택해 응답 상태를 확인하세요.</p></div><span class="tag ok">60 FPS target</span></div>'+
   '<div class="canvas-wrap"><div class="glow"></div><canvas id="gcv"></canvas></div>'+
   '<div class="chart-card"><div class="kicker" style="margin-bottom:6px">Synthetic Activity Stream</div>'+
    '<div class="spark"><svg viewBox="0 0 600 100" preserveAspectRatio="none" aria-label="샘플 스트림 차트">'+
     '<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34d399" stop-opacity=".30"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></linearGradient><mask id="mask"><rect width="600" height="100" fill="white"/></mask></defs>'+
     '<path class="glow" d="M0 76 C70 22 120 52 188 42 S300 78 365 28 S490 64 600 26 V100 H0 Z"/>'+
     '<path class="line" d="M0 76 C70 22 120 52 188 42 S300 78 365 28 S490 64 600 26"/>'+
    '</svg></div><div class="axis"><span>최근</span><span>샘플 스트림</span><span>지금</span></div></div>'+
  '</section>'+
  '<aside class="panel"><div class="panel-pad">'+
   shellMetric("선택 노드",n.name,"상태 · "+label(n.h))+
   shellMetric("응답 속도",n.ms?n.ms+" ms":"연결 없음","현재 선택 노드의 예시 지표")+
   shellMetric("샘플 평가액","₩ "+demoValue.toLocaleString(),"실제 자산이 아닌 UI용 데모 값")+
   '<div class="kpis"><div class="kpi"><b>7/8</b><span>정상 노드</span></div><div class="kpi"><b>99.8%</b><span>예시 가동률</span></div><div class="kpi"><b>0.4ms</b><span>가상 지연</span></div></div>'+
   '<button class="action" id="activityBtn">샘플 활동 1건 생성</button>'+
   '<button class="secondary" id="detailsBtn">노드 상세 보기</button>'+
   '<div class="notice">실제 결제·투자·에스크로 기능은 연결되어 있지 않습니다. 화면은 상태 시각화 데모입니다.</div>'+
  '</div></aside>'+
 '</div>';
}

function healthHTML(){
 const n=selected();
 return '<section class="panel panel-pad"><div class="kicker">Health Monitor</div><div class="hero-title">자산 건강</div><p class="hero-copy">선택한 노드의 응답 속도와 샘플 흐름을 읽기 쉬운 형태로 표시합니다.</p>'+
 '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'+nodes.map(x=>'<button class="secondary" style="width:auto;margin-top:0" data-id="'+x.id+'">'+x.name+'</button>').join('')+'</div>'+
 '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">'+
 '<div>'+shellMetric("현재 노드",n.name,label(n.h)+" · "+(n.ms?n.ms+"ms":"—"))+'<canvas class="tick" id="tcv" style="width:100%;height:200px;border-radius:16px;background:rgba(255,255,255,.025)"></canvas></div>'+
 '<div>'+shellMetric("샘플 평가액","₩ "+demoValue.toLocaleString(),"실제 투자 가치와 무관한 데모 수치")+
 '<div class="vault-list"><div class="step done"><span class="num">✓</span><div><b>데이터 수집</b><div class="meta" style="padding:0">정상</div></div></div><div class="step cur"><span class="num">2</span><div><b>상태 확인</b><div class="meta" style="padding:0">현재 화면</div></div></div></div></div>'+
 '</div></section>';
}

function vaultHTML(){
 return '<section class="panel panel-pad"><div class="kicker">Protection Flow</div><div class="hero-title">안심 금고 · 데모 세션</div><p class="hero-copy">준비 → 확인 → 안전 잠금 → 정산 완료의 UI 흐름만 시연합니다.</p>'+
 '<div style="max-width:760px;margin-top:16px" class="vault-list">'+phases.map((p,i)=>
  '<div class="step '+(i<phase?"done":"")+' '+(i===phase?"cur":"")+'"><span class="num">'+(i<phase?"✓":i+1)+'</span><div><b>'+p+'</b><div class="meta" style="padding:0">'+(i<phase?"완료된 데모 단계":i===phase?"현재 단계":"대기 중")+'</div></div></div>').join('')+
 '</div><div style="display:flex;gap:8px;margin-top:14px"><button class="action" style="max-width:220px" id="next">다음 단계</button><button class="secondary" style="max-width:160px;margin-top:0" id="reset">처음부터</button></div>'+
 '<div class="notice" style="max-width:760px">금전 예치, 투자 확정, 출금 또는 보증금 결제를 요구하지 않는 데모입니다.</div></section>';
}

function guideHTML(){
 return '<section class="panel guide"><div class="kicker">Guide</div><div class="hero-title">이용 안내</div>'+
  '<p>🌍 <b style="color:#fff">지구본 노드</b>에서 전 세계 샘플 노드를 회전하며 상태와 응답 속도를 확인합니다.</p>'+
  '<p>📊 <b style="color:#fff">자산 건강</b>에서는 선택한 노드의 샘플 흐름과 데이터 수집 단계를 살펴봅니다.</p>'+
  '<p>🔒 <b style="color:#fff">안심 금고</b>는 보호 프로세스의 단계 전환만 시뮬레이션합니다.</p>'+
  '<p style="margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.12)">수익·배당·골드바·에스크로에 관한 값과 이벤트는 실제 금융 활동을 나타내지 않으며, UI/성능 데모를 위한 샘플 데이터입니다.</p>'+
 '</section>';
}

function render(){
 app.innerHTML=view==="globe"?globeHTML():view==="health"?healthHTML():view==="vault"?vaultHTML():guideHTML();
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 document.getElementById("statusText").textContent=nodes.some(n=>n.h==="partitioned")?"일부 노드 주의":"정상 연결";
 if(view==="globe"){const c=document.getElementById("gcv");if(c)drawGlobe(c)}
 if(view==="health"){const c=document.getElementById("tcv");if(c)drawTick(c)}
}

function toast(item){
 const el=document.createElement("div");el.className="toast";
 el.innerHTML='<i class="toast-dot"></i><div><b>'+item.title+'</b><span>'+item.text+'</span></div>';
 toastRoot.prepend(el);
 setTimeout(()=>el.classList.add("exit"),3200);
 setTimeout(()=>el.remove(),3550);
}

function drawGlobe(cv){
 const rect=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
 const w=Math.max(1,rect.width),h=Math.max(1,rect.height);
 if(cv.width!==Math.floor(w*dpr)||cv.height!==Math.floor(h*dpr)){cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr)}
 const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const cx=w/2,cy=h/2,R=Math.min(w,h)*.34;
 const proj=(lat,lon)=>{
   const phi=(90-lat)*Math.PI/180,th=(lon+180)*Math.PI/180;
   let x=-R*Math.sin(phi)*Math.cos(th),y=R*Math.cos(phi),z=R*Math.sin(phi)*Math.sin(th);
   const cyy=Math.cos(G.y),syy=Math.sin(G.y);[x,z]=[x*cyy-z*syy,x*syy+z*cyy];
   const cxx=Math.cos(G.x),sxx=Math.sin(G.x);[y,z]=[y*cxx-z*sxx,y*sxx+z*cxx];
   return {x:cx+x,y:cy+y,z,v:z>-R*.12};
 };
 const bg=ctx.createRadialGradient(cx-R*.2,cy-R*.26,R*.12,cx,cy,R);
 bg.addColorStop(0,"#2a4663");bg.addColorStop(1,"#091322");
 ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
 ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle="#8fb2c9";ctx.lineWidth=1;
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.ellipse(cx,cy,R,R*(0.25+Math.abs(i)*.16),0,0,Math.PI*2);ctx.stroke()}
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.ellipse(cx,cy,R*(0.25+Math.abs(i)*.18),R,0,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
 nodes.map(n=>({n,p:proj(n.lat,n.lon)})).filter(o=>o.p.v).sort((a,b)=>a.p.z-b.p.z).forEach(({n,p})=>{
   const active=n.id===sel,r=active?6:4;
   ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
   ctx.fillStyle=n.h==="partitioned"?"#64748b":n.h==="degraded"?"#fbbf24":active?"#ecfdf5":"#34d399";
   if(active){ctx.shadowBlur=18;ctx.shadowColor="#34d399"}ctx.fill();ctx.shadowBlur=0;
   if(active){ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.strokeStyle="rgba(52,211,153,.24)";ctx.stroke()}
 });
 ctx.fillStyle="#71869c";ctx.font="11px Pretendard, sans-serif";ctx.fillText("드래그 회전 · 샘플 노드 8개",16,h-16);
 if(!G.drag)G.y+=.0018;
}

function drawTick(cv){
 const rect=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2),w=rect.width,h=rect.height;
 cv.width=Math.max(1,Math.floor(w*dpr));cv.height=Math.max(1,Math.floor(h*dpr));
 const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const max=Math.max(...ring,1)*1.25;ctx.strokeStyle="rgba(148,163,184,.08)";ctx.lineWidth=1;
 for(let i=1;i<4;i++){const y=(h*i)/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 ctx.beginPath();ring.forEach((v,i)=>{const x=i/(ring.length-1)*w,y=h-12-(v/max)*(h-30);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
 ctx.strokeStyle="#34d399";ctx.lineWidth=2.2;ctx.lineJoin="round";ctx.stroke();
 ctx.fillStyle="#7d91a7";ctx.font="10px Pretendard,sans-serif";ctx.fillText("Synthetic flow",10,14);
}

function update(){
 const n=selected();
 ring.shift();ring.push(20+Math.sin(performance.now()/850)*4+Math.random()*7+(n.ms||20)*.22);
 demoValue+=Math.round((Math.random()-.2)*45);
 if(view==="globe"){const cv=document.getElementById("gcv");if(cv)drawGlobe(cv)}
 if(view==="health"){const cv=document.getElementById("tcv");if(cv)drawTick(cv)}
 requestAnimationFrame(update);
}
render();requestAnimationFrame(update);

document.getElementById("nav").addEventListener("click",e=>{
 const b=e.target.closest("button[data-v]");if(!b)return;view=b.dataset.v;render();
});
app.addEventListener("click",e=>{
 const b=e.target.closest("[data-id]");if(b){sel=b.dataset.id;render();return}
 if(e.target.id==="activityBtn"){toast(activity[Math.floor(Math.random()*activity.length)]);return}
 if(e.target.id==="detailsBtn"){toast({title:"노드 상세",text:selected().name+" · 상태 "+label(selected().h)+" · 응답 "+(selected().ms?selected().ms+"ms":"연결 없음")});return}
 if(e.target.id==="next"){phase=Math.min(phases.length-1,phase+1);render();toast({title:"데모 단계 이동",text:"현재 단계: "+phases[phase]});return}
 if(e.target.id==="reset"){phase=0;render();return}
});

window.addEventListener("resize",()=>{render()});
</script>
