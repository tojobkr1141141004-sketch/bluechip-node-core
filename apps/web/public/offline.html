<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>Offline · APEX-MATRIX</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#07111f; color:#f8fafc; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
      main { width:min(100%,520px); border:1px solid rgba(255,255,255,.09); border-radius:28px; background:#0d1929; padding:32px; box-sizing:border-box; box-shadow:0 24px 80px rgba(0,0,0,.24); }
      .mark { width:48px; height:48px; display:grid; place-items:center; border-radius:16px; background:linear-gradient(135deg,#34d399,#22d3ee); color:#07111f; font-weight:900; }
      h1 { margin:24px 0 8px; font-size:24px; letter-spacing:-.04em; }
      p { margin:0; color:#94a3b8; font-size:14px; line-height:1.7; }
      button { width:100%; min-height:48px; margin-top:24px; border:0; border-radius:14px; background:#f8fafc; color:#07111f; font-weight:800; cursor:pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1 id="title">You are offline</h1>
      <p id="description">Financial requests and mining actions are paused. Reconnect, then refresh to load the latest server records.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      const locale = (navigator.language || "en").toLowerCase();
      const copy = locale.startsWith("ko")
        ? ["인터넷 연결이 끊겼습니다", "금융 요청과 채굴 작업은 일시 중지되었습니다. 연결 후 새로고침하면 최신 서버 기록을 확인할 수 있습니다.", "다시 확인"]
        : locale.startsWith("ja")
          ? ["オフラインです", "入出金申請とマイニング操作は一時停止しています。接続後に再読み込みすると最新のサーバー記録を確認できます。", "再読み込み"]
          : ["You are offline", "Financial requests and mining actions are paused. Reconnect, then refresh to load the latest server records.", "Try again"];
      document.documentElement.lang = locale.startsWith("ko") ? "ko" : locale.startsWith("ja") ? "ja" : "en";
      document.getElementById("title").textContent = copy[0];
      document.getElementById("description").textContent = copy[1];
      document.getElementById("retry").textContent = copy[2];
      document.getElementById("retry").addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
